name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build, seed
    runs-on: ubuntu-latest

    # A real Postgres, because that is what production is now.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inherent
          POSTGRES_PASSWORD: inherent
          POSTGRES_DB: inherent_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inherent -d inherent_os"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://inherent:inherent@localhost:5432/inherent_os
      DIRECT_URL: postgresql://inherent:inherent@localhost:5432/inherent_os
      # Build-time only. Never a real secret.
      AUTH_SECRET: ci-only-secret-not-used-at-runtime-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # A route that reads live state must never be prerendered — see
      # scripts/assert-dynamic-routes.ts for the bug this guards.
      - name: No live route may be prerendered
        run: npm run verify:routes

      # Vercel builds with no database access. The build must not need one.
      - name: The build must succeed with no database reachable
        env:
          DATABASE_URL: postgresql://nobody:nope@127.0.0.1:9999/nothing
          DIRECT_URL: postgresql://nobody:nope@127.0.0.1:9999/nothing
        run: |
          rm -rf .next
          npm run build
          npm run verify:routes

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: The database must start out empty
        run: |
          set +e; npx tsx scripts/is-empty.ts; code=$?; set -e
          test "$code" = "0" || { echo "Expected exit 0 on a fresh database, got $code"; exit 1; }

      - name: Seed, then seed again — it must be idempotent
        run: |
          npx tsx prisma/seed.ts
          npx tsx prisma/seed.ts
          npx tsx scripts/verify-seed.ts

      - name: A seeded database must report itself as non-empty
        run: |
          set +e; npx tsx scripts/is-empty.ts; code=$?; set -e
          test "$code" = "1" || { echo "Expected exit 1 after seeding, got $code"; exit 1; }

      - name: An unreachable database must abort, never silently skip
        env:
          DATABASE_URL: postgresql://nobody:nope@127.0.0.1:9999/nothing
          DIRECT_URL: postgresql://nobody:nope@127.0.0.1:9999/nothing
        run: |
          set +e; npx tsx scripts/is-empty.ts; code=$?; set -e
          test "$code" = "2" || { echo "Expected exit 2 when the database is unreachable, got $code"; exit 1; }
