name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    env:
      # Build-time only. Never a real secret — the app reads its own at runtime.
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-only-secret-not-used-at-runtime-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Seed a throwaway database
        run: |
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts

      - name: Re-run the seed, then assert the invariants
        run: |
          npx tsx prisma/seed.ts
          npx tsx scripts/verify-seed.ts
