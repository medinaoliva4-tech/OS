name: Deploy to Vercel

# Runs migrations against Supabase, then ships the build to Vercel.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        a Vercel access token
#   VERCEL_ORG_ID       from .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID   likewise
#   DIRECT_URL          the Supabase DIRECT connection string (port 5432)
#
# DATABASE_URL (the pooled one) and AUTH_SECRET are set in the Vercel project's
# own environment, not here — the app reads them at runtime. DIRECT_URL is
# needed here because migrations run on this runner, not on Vercel.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Which Vercel environment to ship
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the secrets are present
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
          DIRECT: ${{ secrets.DIRECT_URL }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing VERCEL_TOKEN"
          [ -n "$ORG" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$PROJECT" ] || missing="$missing VERCEL_PROJECT_ID"
          [ -n "$DIRECT" ]  || missing="$missing DIRECT_URL"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            echo "See the Deploying section of the README."
            exit 1
          fi
          echo "All required secrets are set."

      - run: npm ci

      # Migrations use the DIRECT connection: transaction-mode pooling cannot
      # run DDL or hold the advisory lock Prisma takes.
      - name: Apply migrations to Supabase
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

      # Idempotent: seeds the founding team on an empty database, no-ops after.
      - name: Seed the founding team if the database is empty
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: |
          set +e; npx tsx scripts/is-empty.ts; empty=$?; set -e
          case "$empty" in
            0) npx tsx prisma/seed.ts ;;
            1) echo "Database already has accounts — not seeding." ;;
            *) echo "Could not read the database; refusing to continue."; exit 1 ;;
          esac

      - name: Assert the seed invariants
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx scripts/verify-seed.ts

      - name: Install the Vercel CLI
        run: npm i -g vercel@latest

      - name: Resolve the target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.environment }}" = "production" ]; then
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
            echo "name=production" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "name=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull the Vercel project settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=${{ steps.target.outputs.name }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      # A deploy that 500s is not a deploy.
      - name: The sign-in page must load and state the domain lock
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/login.html -w '%{http_code}' "$URL/login" || true)
            [ "$CODE" = "200" ] && break
            echo "attempt $i: $CODE"; sleep 5
          done
          test "$CODE" = "200" || { echo "/login returned $CODE"; exit 1; }
          grep -q "inherentglobal.com" /tmp/login.html \
            || { echo "Sign-in page did not mention the domain lock"; exit 1; }
          echo "Sign-in page is live."

      - name: A guest must be redirected
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}/")
          echo "GET / -> $CODE"
          case "$CODE" in 307|302|308) ;; *) echo "Expected a redirect"; exit 1 ;; esac

      - name: Summary
        run: |
          {
            echo "### Deployed to ${{ steps.target.outputs.name }}"
            echo
            echo "<${{ steps.deploy.outputs.url }}>"
            echo
            echo "Sign in with an @inherentglobal.com account."
          } >> "$GITHUB_STEP_SUMMARY"
